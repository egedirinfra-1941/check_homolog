name: Simulacao

on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Atualizar lista de pacotes
        run: sudo apt-get update

      - name: Executar o script
        env:
          GSHEET_CRED: ${{ secrets.GSHEET_CRED }}
          GSHEET_KEY_SHEET: ${{ secrets.GSHEET_KEY_SHEET }}
          JSON_KEY: ${{ secrets.JSON_KEY }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          RECEIVER_EMAIL2: ${{ secrets.RECEIVER_EMAIL2 }}
          RECEIVER_EMAIL3: ${{ secrets.RECEIVER_EMAIL3 }}
          RECEIVER_EMAIL4: ${{ secrets.RECEIVER_EMAIL4 }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: python check_homolog.py

      - name: Comitar e-mail simulado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add email_simulado/

          git diff --staged --quiet || git commit -m "Atualiza e-mail simulado"

          git push
